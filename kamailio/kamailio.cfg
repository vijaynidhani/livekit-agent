#!/bin/kamailio

loadmodule "pv.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"


listen = udp:0.0.0.0:5062

request_route {
    xlog("L_INFO", "=== INCOMING REQUEST: $$rm ===\n");
    
    if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "Max forwards exceeded for $$rm\n");
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    if (is_method("REGISTER")) {
        xlog("L_INFO", "REGISTER from $$fu ($$ua) - auto-accepting\n");
        sl_send_reply("200","Registered");
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE from $$fu to $$ru - rewriting to 127.0.0.1:5060\n");
        record_route();
        rewritehostport("127.0.0.1:5060");
        t_on_reply("HANDLE_REPLY");
        route("RELAY");
        exit;
    }

    if (is_method("OPTIONS")) {
        xlog("L_INFO", "OPTIONS from $$fu - sending 200 OK\n");
        sl_send_reply("200","OK");
        exit;
    }

    xlog("L_INFO", "Other method $$rm - relaying\n");
    route("RELAY");
}

route[RELAY] {
    xlog("L_INFO", "RELAY: relaying $$rm to $$rd\n");
    if (!t_relay()) {
        xlog("L_ERROR", "RELAY: t_relay failed for $$rm to $$rd\n");
        sl_reply_error();
    }
    exit;
}

onreply_route[HANDLE_REPLY] {

    if (t_check_status("200")) {
        xlog("L_INFO", "200 OK received\n");

        remove_hf("Contact");

        append_hf(
            "Contact: <sip:127.0.0.1:5060;transport=udp>\r\n"
        );
    }
}