#!/bin/kamailio

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"

listen=udp:0.0.0.0:5062

request_route {

    xlog("L_INFO", "===== SIP REQUEST =====\n");
    xlog("L_INFO", "Method=$rm From=$fu To=$ru CallID=$ci\n");

    #
    # Max-Forwards
    #
    if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "Too many hops\n");
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    #
    # ACK (must be before loose_route)
    #
    if (is_method("ACK")) {

        xlog("L_INFO", "ACK received\n");

        if (t_check_trans()) {
            xlog("L_INFO", "ACK matched transaction\n");
            route(RELAY);
            exit;
        }

        if (loose_route()) {
            xlog("L_INFO", "ACK matched dialog\n");
            route(RELAY);
            exit;
        }

        xlog("L_WARN", "Dropping unmatched ACK\n");
        exit;
    }

    #
    # In-dialog requests
    #
    if (loose_route()) {

        xlog("L_INFO", "In-dialog request: $rm\n");

        route(RELAY);
        exit;
    }

    #
    # REGISTER
    #
    if (is_method("REGISTER")) {

        xlog("L_INFO", "REGISTER\n");

        sl_send_reply("200", "Registered");
        exit;
    }

    #
    # OPTIONS
    #
    if (is_method("OPTIONS")) {

        xlog("L_INFO", "OPTIONS\n");

        sl_send_reply("200", "OK");
        exit;
    }

    #
    # Initial INVITE
    #
    if (is_method("INVITE")) {

        xlog("L_INFO", "Initial INVITE -> LiveKit\n");

        #
        # Keep dialog through Kamailio
        #
        record_route();

        #
        # Forward to LiveKit SIP
        #
        rewritehostport("127.0.0.1:5060");

        #
        # Log replies
        #
        t_on_reply("MANAGE_REPLY");

        #
        # Relay
        #
        route(RELAY);
        exit;
    }

    #
    # Everything else
    #
    xlog("L_INFO", "Relaying other request: $rm\n");

    route(RELAY);
}

route[RELAY] {

    xlog("L_INFO", "Relaying $rm\n");

    if (!t_relay()) {

        xlog("L_ERR", "t_relay() failed\n");

        sl_reply_error();
    }

    exit;
}

onreply_route[MANAGE_REPLY] {

    xlog("L_INFO",
        "Reply: status=$rs reason=$rr method=$rm\n");
}
