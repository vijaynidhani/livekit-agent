#!/bin/kamailio

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"

listen = udp:0.0.0.0:5062

request_route {
    xlog("L_INFO", "=== INCOMING REQUEST: $rm From:$fu To:$ru ===\n");

    if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "Max forwards exceeded for $rm\n");
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    #
    # Handle in-dialog requests (ACK, BYE, UPDATE, INFO, REFER, etc.)
    #
    if (loose_route()) {
        xlog("L_INFO", "In-dialog request: $rm\n");
        route(RELAY);
        exit;
    }

    #
    # ACK for local transaction
    #
    if (is_method("ACK")) {
        xlog("L_INFO", "Received ACK\n");

        if (t_check_trans()) {
            route(RELAY);
        }

        exit;
    }

    #
    # REGISTER
    #
    if (is_method("REGISTER")) {
        xlog("L_INFO", "REGISTER from $fu ($ua)\n");
        sl_send_reply("200", "Registered");
        exit;
    }

    #
    # OPTIONS
    #
    if (is_method("OPTIONS")) {
        xlog("L_INFO", "OPTIONS from $fu\n");
        sl_send_reply("200", "OK");
        exit;
    }

    #
    # Initial INVITE
    #
    if (is_method("INVITE")) {

        xlog("L_INFO", "Forwarding INVITE to LiveKit SIP\n");

        #
        # Keep dialog through Kamailio
        #
        record_route();

        #
        # Forward to LiveKit SIP
        #
        rewritehostport("127.0.0.1:5060");

        #
        # Log replies
        #
        t_on_reply("MANAGE_REPLY");

        route(RELAY);
        exit;
    }

    #
    # Everything else
    #
    route(RELAY);
}

route[RELAY] {

    xlog("L_INFO",
        "Relaying $rm to $ru ($du)\n");

    if (!t_relay()) {
        xlog("L_ERR", "t_relay() failed for $rm\n");
        sl_reply_error();
    }

    exit;
}

onreply_route[MANAGE_REPLY] {

    xlog("L_INFO",
        "Reply $rs $rr for $rm from $si:$sp\n");
}