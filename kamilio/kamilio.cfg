#!/bin/kamailio

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"

listen=udp:0.0.0.0:5062

request_route {

    xlog("L_INFO",
        "==============================\n"
        "METHOD=$rm\n"
        "FROM=$fu\n"
        "TO=$tu\n"
        "RURI=$ru\n"
        "SRC=$si:$sp\n"
        "CALLID=$ci\n"
        "==============================\n");

    if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "Max-Forwards exceeded\n");
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    #
    # ACK for 200 OK
    #
    if (is_method("ACK")) {

        xlog("L_INFO",
            "ACK received\n"
            "RURI=$ru\n"
            "DST=$du\n"
            "CALLID=$ci\n");

        if (t_check_trans()) {
            xlog("L_INFO","ACK belongs to existing transaction\n");
            route(RELAY);
        } else if (loose_route()) {
            xlog("L_INFO","ACK loose_route()\n");
            route(RELAY);
        } else {
            xlog("L_WARN","ACK dropped (no transaction)\n");
        }

        exit;
    }

    #
    # In-dialog requests
    #
    if (loose_route()) {

        xlog("L_INFO",
            "In-dialog $rm\n"
            "CALLID=$ci\n"
            "RURI=$ru\n");

        route(RELAY);
        exit;
    }

    #
    # REGISTER
    #
    if (is_method("REGISTER")) {
        xlog("L_INFO","REGISTER from $fu UA=$ua\n");
        sl_send_reply("200","Registered");
        exit;
    }

    #
    # OPTIONS
    #
    if (is_method("OPTIONS")) {
        xlog("L_INFO","OPTIONS from $si\n");
        sl_send_reply("200","OK");
        exit;
    }

    #
    # Initial INVITE
    #
    if (is_method("INVITE")) {

        xlog("L_INFO",
            "Initial INVITE\n"
            "CALLID=$ci\n"
            "Forwarding to LiveKit 127.0.0.1:5060\n");

        record_route();

        $du = "sip:127.0.0.1:5060;transport=udp";

        t_on_reply("MANAGE_REPLY");
        t_on_failure("FAILURE");

        route(RELAY);
        exit;
    }

    #
    # Other requests
    #
    xlog("L_INFO","Relaying other request $rm\n");

    route(RELAY);
}

route[RELAY] {

    xlog("L_INFO",
        "Relaying\n"
        "METHOD=$rm\n"
        "RURI=$ru\n"
        "DST=$du\n"
        "SRC=$si:$sp\n"
        "CALLID=$ci\n");

    if (!t_relay()) {

        xlog("L_ERR",
            "t_relay FAILED\n"
            "METHOD=$rm\n"
            "DST=$du\n"
            "CALLID=$ci\n");

        sl_reply_error();
    }

    exit;
}

onreply_route[MANAGE_REPLY] {

    xlog("L_INFO",
        "===== SIP REPLY =====\n"
        "STATUS=$rs\n"
        "REASON=$rr\n"
        "METHOD=$rm\n"
        "SRC=$si:$sp\n"
        "CALLID=$ci\n"
        "CONTACT=$(ct{nameaddr.uri})\n"
        "=====================\n");
}

failure_route[FAILURE] {

    xlog("L_ERR",
        "Transaction failure\n"
        "METHOD=$rm\n"
        "STATUS=$T_reply_code\n"
        "CALLID=$ci\n");
}